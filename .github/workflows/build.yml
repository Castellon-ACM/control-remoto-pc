name: Tests y compilar .exe (Windows)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install --upgrade pip pytest pillow pyinstaller

      - name: Ejecutar los tests
        run: python -m pytest -q

      # --onedir (menos falsos positivos que --onefile) y sin UPX.
      - name: Compilar el servidor y el monitor
        run: |
          pyinstaller --onedir --noupx --windowed --name AgenteAuto   agente_auto.py
          pyinstaller --onedir --noupx --windowed --name MonitorFlota consola_flota.py

      # Con --onedir el .exe va dentro de una carpeta; se sube todo comprimido.
      - name: Subir el servidor (carpeta AgenteAuto)
        uses: actions/upload-artifact@v4
        with:
          name: AgenteAuto
          path: dist/AgenteAuto

      - name: Subir el monitor (carpeta MonitorFlota)
        uses: actions/upload-artifact@v4
        with:
          name: MonitorFlota
          path: dist/MonitorFlota

      - name: Publicar Release (solo al crear un tag vX.Y.Z)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AgenteAuto/**
            dist/MonitorFlota/**
