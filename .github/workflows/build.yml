name: Tests y compilar .exe (Windows)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install pytest pillow pyinstaller

      - name: Ejecutar los tests
        run: python -m pytest -q

      - name: Compilar los .exe
        run: |
          pyinstaller --onefile --windowed --name Agente       agente.py
          pyinstaller --onefile --windowed --name Consola      consola.py
          pyinstaller --onefile --windowed --name AgenteNube   agente_nube.py
          pyinstaller --onefile --windowed --name ConsolaNube  consola_nube.py
          pyinstaller --onefile --windowed --name AgenteRelay  agente_relay.py
          pyinstaller --onefile --windowed --name Monitor      consola_multi.py
          pyinstaller --onefile --windowed --name AgenteAuto   agente_auto.py
          pyinstaller --onefile --windowed --name MonitorFlota consola_flota.py

      - name: Subir los .exe como artifact
        uses: actions/upload-artifact@v4
        with:
          name: control-remoto-exe
          path: dist/*.exe

      - name: Publicar Release (solo al crear un tag vX.Y.Z)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
